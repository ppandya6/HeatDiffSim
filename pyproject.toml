[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heatdiffsim"
version = "1.0.0"
description = "Two-dimensional finite-difference heat diffusion and convergence experiments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.scripts]
heatdiffsim = "heatdiffsim.__main__:main"

[tool.setuptools.packages.find]
include = ["heatdiffsim*"]
